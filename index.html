<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="room">
    <!-- 時計と日時 -->
    <div class="clock-container">
      <div id="date" class="date"></div>
      <div id="time" class="time"></div>
    </div>

    <!-- 出窓エリア -->
    <div class="bay-window-container">
      <p class="guide-text">↔ カーテンを左右にドラッグして開閉できます</p>
      
      <!-- 
        重要：カーテンをつかめるように、window-frame の中にあったカーテンを、
        window-area 全体の直下に移動しました。
      -->
      <div class="bay-window" id="window-area">
        <!-- 窓の外（しとしと降る雨） -->
        <div class="window-glass">
          <div class="rain-container">
            <!-- 雨の粒をたくさん設置 -->
            <div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div>
            <div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div>
            <div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div>
            <div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div>
            <div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div>
            <div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div>
          </div>
        </div>

        <!-- 赤いカーテン (左と右) -->
        <div id="curtain-left" class="curtain curtain-left">
          <div class="curtain-handle"></div>
        </div>
        <div id="curtain-right" class="curtain curtain-right">
          <div class="curtain-handle"></div>
        </div>

        <!-- 窓枠とカウンター（出窓の棚） -->
        <div class="window-frame-grid"></div>
        <div class="window-sill"></div>
      </div>
    </div>

    <!-- 雨音オーディオ -->
    <audio id="rain-sound" loop src="https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg"></audio>
    
    <button id="audio-toggle" class="audio-btn">🔊 雨音の再生 / 停止</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
